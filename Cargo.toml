[workspace]
resolver = "2"
members = [
    # Core & Digital Twin
    "crates/core/tpt-yard-core",
    "crates/core/tpt-yard-assembly",
    "crates/core/tpt-yard-weight",
    "crates/core/tpt-yard-digital-twin",
    # Structural During Construction
    "crates/structural/tpt-yard-structural",
    "crates/structural/tpt-yard-welding",
    "crates/structural/tpt-yard-distortion",
    "crates/structural/tpt-yard-joints",
    # Sea Shipyard
    "crates/sea/tpt-yard-hull",
    "crates/sea/tpt-yard-blocks",
    "crates/sea/tpt-yard-drydock",
    "crates/sea/tpt-yard-launch",
    "crates/sea/tpt-yard-outfitting",
    "crates/sea/tpt-yard-sea-trials",
    "crates/sea/tpt-yard-hydrostatics",
    # Space Shipyard
    "crates/space/tpt-yard-orbital-assembly",
    "crates/space/tpt-yard-space-structural",
    "crates/space/tpt-yard-space-manufacturing",
    "crates/space/tpt-yard-robotic-assembly",
    "crates/space/tpt-yard-habitat",
    "crates/space/tpt-yard-propellant",
    # Planning & Logistics
    "crates/planning/tpt-yard-scheduling",
    "crates/planning/tpt-yard-logistics",
    "crates/planning/tpt-yard-facility",
    "crates/planning/tpt-yard-quality",
    # Web bindings (wasm)
    "crates/web/tpt-yard-wasm",
    # Integration
    "crates/integration/tpt-yard-transport-link",
    "crates/integration/tpt-yard-process-link",
    "crates/integration/tpt-yard-earth-link",
    # Facade & CLI
    "crates/facade/tpt-yard",
    "crates/cli/tpt-yard-cli",
    # Examples & benchmarks
    "examples/container-ship-block-assembly",
    "examples/orbital-station-truss",
    "examples/rotating-habitat-construction",
    "examples/submarine-pressure-hull",
    "examples/space-solar-array-assembly",
    "examples/drydock-flooding-sequence",
    "benches",
]
# The PyO3 bindings stay out of the workspace: pyo3 needs a Python
# interpreter at build time, so plain workspace builds must not touch
# them (see crates/bindings/tpt-yard-py/README.md).
exclude = ["crates/bindings/tpt-yard-py"]

[workspace.package]
rust-version = "1.98"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-solutions/tpt-shipyard"
authors = ["TPT Solutions"]

[workspace.dependencies]
# Internal crates (single source of truth for inter-crate edges).
tpt-yard-core = { path = "crates/core/tpt-yard-core", version = "0.1.0" }
tpt-yard-assembly = { path = "crates/core/tpt-yard-assembly", version = "0.1.0" }
tpt-yard-weight = { path = "crates/core/tpt-yard-weight", version = "0.1.0" }
tpt-yard-digital-twin = { path = "crates/core/tpt-yard-digital-twin", version = "0.1.0" }
tpt-yard-joints = { path = "crates/structural/tpt-yard-joints", version = "0.1.0" }
tpt-yard-structural = { path = "crates/structural/tpt-yard-structural", version = "0.1.0" }
tpt-yard-welding = { path = "crates/structural/tpt-yard-welding", version = "0.1.0" }
tpt-yard-distortion = { path = "crates/structural/tpt-yard-distortion", version = "0.1.0" }
tpt-yard-blocks = { path = "crates/sea/tpt-yard-blocks", version = "0.1.0" }
tpt-yard-hull = { path = "crates/sea/tpt-yard-hull", version = "0.1.0" }
tpt-yard-drydock = { path = "crates/sea/tpt-yard-drydock", version = "0.1.0" }
tpt-yard-launch = { path = "crates/sea/tpt-yard-launch", version = "0.1.0" }
tpt-yard-outfitting = { path = "crates/sea/tpt-yard-outfitting", version = "0.1.0" }
tpt-yard-sea-trials = { path = "crates/sea/tpt-yard-sea-trials", version = "0.1.0" }
tpt-yard-robotic-assembly = { path = "crates/space/tpt-yard-robotic-assembly", version = "0.1.0" }
tpt-yard-space-structural = { path = "crates/space/tpt-yard-space-structural", version = "0.1.0" }
tpt-yard-orbital-assembly = { path = "crates/space/tpt-yard-orbital-assembly", version = "0.1.0" }
tpt-yard-habitat = { path = "crates/space/tpt-yard-habitat", version = "0.1.0" }
tpt-yard-propellant = { path = "crates/space/tpt-yard-propellant", version = "0.1.0" }
tpt-yard-space-manufacturing = { path = "crates/space/tpt-yard-space-manufacturing", version = "0.1.0" }
tpt-yard-scheduling = { path = "crates/planning/tpt-yard-scheduling", version = "0.1.0" }
tpt-yard-quality = { path = "crates/planning/tpt-yard-quality", version = "0.1.0" }
tpt-yard-logistics = { path = "crates/planning/tpt-yard-logistics", version = "0.1.0" }
tpt-yard-facility = { path = "crates/planning/tpt-yard-facility", version = "0.1.0" }
tpt-yard-hydrostatics = { path = "crates/sea/tpt-yard-hydrostatics", version = "0.1.0" }
tpt-yard-transport-link = { path = "crates/integration/tpt-yard-transport-link", version = "0.1.0" }
tpt-yard-process-link = { path = "crates/integration/tpt-yard-process-link", version = "0.1.0" }
tpt-yard-earth-link = { path = "crates/integration/tpt-yard-earth-link", version = "0.1.0" }
tpt-yard-wasm = { path = "crates/web/tpt-yard-wasm", version = "0.1.0" }
tpt-yard = { path = "crates/facade/tpt-yard", version = "0.1.0" }
# External
wasm-bindgen = "=0.2.128"
# wasm-bindgen-test ships its own 0.3.x line; 0.3.78 pins wasm-bindgen
# "=0.2.128" exactly (the two crates' version numbers diverged in 2019).
wasm-bindgen-test = "=0.3.78"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[profile.release]
lto = "thin"

[profile.bench]
debug = true
