<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tpt-shipyard — Construction Dashboard</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; font-family: "Segoe UI", system-ui, sans-serif;
    background: #0e1420; color: #dce6f5;
  }
  header {
    padding: 14px 22px; border-bottom: 1px solid #1d2a3f;
    display: flex; align-items: baseline; gap: 14px;
  }
  header h1 { font-size: 18px; margin: 0; color: #7fb4ff; }
  header span { font-size: 12px; color: #6b7f9e; }
  main { display: flex; gap: 16px; padding: 16px 22px; flex-wrap: wrap; }
  .panel {
    background: #131c2e; border: 1px solid #1d2a3f; border-radius: 10px;
    padding: 14px;
  }
  #stage { flex: 2 1 640px; }
  #side { flex: 1 1 280px; display: flex; flex-direction: column; gap: 12px; }
  #viewport { position: relative; }
  #cv { background: #0a101b; border-radius: 6px; display: block; width: 100%; height: 440px; }
  #hint {
    position: absolute; right: 10px; bottom: 8px; font-size: 11px;
    color: #51647f; pointer-events: none;
  }
  button {
    background: #1c3563; color: #cfe2ff; border: 1px solid #2c4a85;
    padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px;
  }
  button:hover { background: #25437a; }
  button:disabled { opacity: 0.4; cursor: default; }
  .kv { display: flex; justify-content: space-between; padding: 3px 0; font-size: 13px; }
  .kv b { color: #9fc2ff; font-weight: 600; }
  #progress { height: 8px; background: #0a101b; border-radius: 4px; overflow: hidden; margin: 8px 0; }
  #bar { height: 100%; width: 0%; background: linear-gradient(90deg,#2c6bed,#57d1a4); transition: width .3s; }
  pre { font-size: 11px; color: #8ba3c7; white-space: pre-wrap; margin: 0; }
  .ok { color: #57d1a4; } .bad { color: #ff7b72; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<header>
  <h1>tpt-shipyard</h1>
  <span>construction digital twin — WebAssembly + three.js</span>
</header>
<main>
  <div class="panel" id="stage">
    <h3 style="margin:2px 0 10px">Erection state (WASM mesh, 3-D)</h3>
    <div id="viewport">
      <canvas id="cv"></canvas>
      <span id="hint">drag to orbit · wheel to zoom · right-drag to pan</span>
    </div>
    <div id="progress"><div id="bar"></div></div>
    <button id="step">Erect next block</button>
    <button id="auto">Run to completion</button>
    <button id="reset">Reset</button>
  </div>
  <div class="panel" id="side">
    <div>
      <h3 style="margin:2px 0 8px">Weight &amp; CoG</h3>
      <div class="kv"><span>Installed</span><b id="w-inst">–</b></div>
      <div class="kv"><span>Best estimate</span><b id="w-best">–</b></div>
      <div class="kv"><span>Design</span><b id="w-design">–</b></div>
      <div class="kv"><span>Deviation</span><b id="w-dev">–</b></div>
      <div class="kv"><span>CoG x</span><b id="cog">–</b></div>
    </div>
    <div>
      <h3 style="margin:2px 0 8px">Structural check</h3>
      <div class="kv"><span>Status</span><b id="s-pass">–</b></div>
      <div class="kv"><span>Margin</span><b id="s-margin">–</b></div>
      <div class="kv"><span>Reactions (aft / fore)</span><b id="s-react">–</b></div>
      <pre id="raw"></pre>
    </div>
  </div>
</main>
<script type="module">
// Handle a missing/failed WASM build gracefully (review 7E): pkg/ is a
// build artifact; a checkout without `wasm-bindgen` should show a clear
// message instead of a bare module error.
async function loadTwin() {
  try {
    const mod = await import("./pkg/tpt_yard_wasm.js");
    await mod.default();
    return mod;
  } catch (err) {
    document.getElementById("stage").insertAdjacentHTML(
      "afterbegin",
      '<p class="bad" id="load-error">WASM module not available: build it with ' +
      '<code>cargo build -p tpt-yard-wasm --target wasm32-unknown-unknown --release</code> and ' +
      '<code>wasm-bindgen --out-dir www/pkg --target web target/wasm32-unknown-unknown/release/tpt_yard_wasm.wasm</code>, ' +
      'then reload. (' + err + ')</p>'
    );
    for (const id of ["step", "auto", "reset"]) {
      document.getElementById(id).disabled = true;
    }
    return null;
  }
}

const mod = await loadTwin();

// 12-block barge project, one erection phase per block.
function projectJson(blocks) {
  const phases = [];
  for (let i = 1; i <= blocks; i++) {
    phases.push({
      id: i,
      name: `Erection phase ${i}`,
      activities: [{
        id: i,
        name: `Erect block ${200 + i}`,
        activity_type: { kind: "join_block" },
        dependencies: i === 1 ? [] : [i - 1],
        duration_hours: 6,
        resources: [],
      }],
      structural_state: { kind: "not_started" },
      weight_state: { design_kg: 142800, installed_kg: 0 },
      duration_days: 4,
    });
  }
  return JSON.stringify({
    id: 1,
    name: "Container ship 1400 TEU (WASM demo)",
    vessel_type: { kind: "sea", value: { kind: "container_ship", teu_capacity: 1400 } },
    construction_method: "sea_drydock",
    build_phases: phases,
    current_phase: 1,
  });
}

if (mod) {
  // three.js may fail without network (the CDN import map); the controls
  // stay usable and the failure is reported instead of a dead canvas.
  let three = null;
  try {
    three = {
      THREE: await import("three"),
      OrbitControls: (await import("three/addons/controls/OrbitControls.js")).OrbitControls,
    };
  } catch (err) {
    document.getElementById("stage").insertAdjacentHTML(
      "afterbegin",
      '<p class="bad">three.js could not be loaded (offline?): ' + err + '</p>'
    );
  }

  let twin = new mod.WasmDigitalTwin(projectJson(12));

  const BLOCKS = 12;
  let timer = null;
  let running = false;

  function fmtT(kg) { return (kg / 1000).toFixed(0) + " t"; }

  // ------------------------------------------------------------- 3-D view
  let view = null;
  if (three) {
    const { THREE, OrbitControls } = three;
    const canvas = document.getElementById("cv");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a101b);

    const camera = new THREE.PerspectiveCamera(50, 2, 0.1, 2000);
    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    // Follow the growing structure until the user takes over the camera.
    let userInteracted = false;
    controls.addEventListener("start", () => {
      userInteracted = true;
    });

    scene.add(new THREE.HemisphereLight(0x9fc2ff, 0x1a2438, 1.4));
    const sun = new THREE.DirectionalLight(0xffffff, 1.6);
    sun.position.set(60, 120, 90);
    scene.add(sun);

    const grid = new THREE.GridHelper(240, 24, 0x24324c, 0x16202f);
    scene.add(grid);

    // The WASM geometry is z-up; the group maps it to three.js y-up.
    const group = new THREE.Group();
    group.rotation.x = -Math.PI / 2;
    scene.add(group);

    const material = new THREE.MeshStandardMaterial({
      vertexColors: true, metalness: 0.15, roughness: 0.65,
    });
    const mesh = new THREE.Mesh(new THREE.BufferGeometry(), material);
    group.add(mesh);

    // As-built CoG marker (local = WASM coordinates).
    const cogMarker = new THREE.Mesh(
      new THREE.SphereGeometry(1.4, 24, 16),
      new THREE.MeshBasicMaterial({ color: 0xffb454 })
    );
    cogMarker.visible = false;
    group.add(cogMarker);

    function resize() {
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }
    window.addEventListener("resize", resize);

    function frameCamera(box) {
      const size = box.getSize(new THREE.Vector3());
      const centre = box.getCenter(new THREE.Vector3());
      const radius = Math.max(size.length() / 2, 5);
      controls.target.copy(centre);
      camera.position.set(
        centre.x + radius * 0.9,
        centre.y + radius * 0.8,
        centre.z + radius * 1.3
      );
      controls.update();
    }

    function updateMesh(report) {
      const verts = twin.get_geometry();      // 9 floats per triangle
      const idx = twin.get_geometry_indices(); // 3 vertex indices per face
      const posAttr = new THREE.Float32BufferAttribute(verts, 3);
      mesh.geometry.dispose();
      mesh.geometry = new THREE.BufferGeometry();
      mesh.geometry.setAttribute("position", posAttr);
      if (idx.length > 0) mesh.geometry.setIndex(Array.from(idx));
      mesh.geometry.computeVertexNormals();

      // Colour by along-ship position (a cheap block-id gradient).
      const count = verts.length / 3;
      const colors = new Float32Array(verts.length);
      let xMin = Infinity, xMax = -Infinity;
      for (let i = 0; i < count; i++) {
        const x = verts[i * 3];
        if (x < xMin) xMin = x;
        if (x > xMax) xMax = x;
      }
      const span = Math.max(xMax - xMin, 1e-6);
      const lo = new THREE.Color(0x2c6bed), hi = new THREE.Color(0x57d1a4);
      for (let i = 0; i < count; i++) {
        const t = (verts[i * 3] - xMin) / span;
        const c = lo.clone().lerp(hi, t);
        colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
      }
      mesh.geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

      const done = twin.completed_count();
      mesh.visible = idx.length > 0;
      cogMarker.visible = done > 0;
      if (done > 0) {
        cogMarker.position.set(report.cog[0], 0, report.cog[2] + 1.5);
      }
      if (done === 0) {
        // Fresh/reset twin: frame the empty build slot so the next block
        // appears in view.
        frameCamera(new THREE.Box3(
          new THREE.Vector3(0, -3, -3),
          new THREE.Vector3(BLOCKS * 10, 3, 3)
        ));
      } else if (!userInteracted) {
        // Follow the erection until the user orbits by themselves.
        frameCamera(new THREE.Box3().setFromObject(mesh));
      }
    }

    function renderLoop() {
      requestAnimationFrame(renderLoop);
      resize();
      controls.update();
      renderer.render(scene, camera);
    }
    view = { updateMesh, resetUser: () => { userInteracted = false; } };
    resize();
    renderLoop();
  }

  // ------------------------------------------------------- reports / flow
  const bar = document.getElementById("bar");
  const stepBtn = document.getElementById("step");
  const autoBtn = document.getElementById("auto");
  const resetBtn = document.getElementById("reset");

  function refresh() {
    const report = JSON.parse(twin.get_weight_report());
    const check = JSON.parse(twin.structural_check());

    document.getElementById("w-inst").textContent = fmtT(report.installed_kg);
    document.getElementById("w-best").textContent = fmtT(report.best_estimate_kg);
    document.getElementById("w-design").textContent = fmtT(report.design_kg);
    const dev = report.deviation_kg;
    document.getElementById("w-dev").textContent = fmtT(dev);
    document.getElementById("w-dev").className = dev > 0 ? "bad" : "ok";
    document.getElementById("cog").textContent = report.cog[0].toFixed(1) + " m";

    const pass = document.getElementById("s-pass");
    pass.textContent = check.passed ? "PASSED" : "FAILED";
    pass.className = check.passed ? "ok" : "bad";
    document.getElementById("s-margin").textContent = (check.margin * 100).toFixed(1) + " %";
    document.getElementById("s-react").textContent =
      (check.reactions.aft ?? 0).toFixed(0) + " / " + (check.reactions.fore ?? 0).toFixed(0) + " kN";
    document.getElementById("raw").textContent = JSON.stringify(check);

    const done = twin.completed_count();
    bar.style.width = (done / BLOCKS * 100) + "%";
    if (view) view.updateMesh(report);

    stepBtn.disabled = running || done >= BLOCKS;
    autoBtn.disabled = running || done >= BLOCKS;
  }

  function stopRun() {
    if (timer !== null) {
      clearInterval(timer);
      timer = null;
    }
    running = false;
  }

  // Free the old twin's WASM memory before replacing it (review 7E).
  function replaceTwin() {
    twin.free();
    twin = new mod.WasmDigitalTwin(projectJson(BLOCKS));
    if (view) view.resetUser();
  }

  stepBtn.onclick = () => {
    twin.advance_next();
    refresh();
  };

  autoBtn.onclick = () => {
    // Review 7E: "Run" is disabled while running — no double timers.
    if (running) return;
    running = true;
    autoBtn.textContent = "Running…";
    autoBtn.disabled = true;
    stepBtn.disabled = true;
    timer = setInterval(() => {
      const sound = twin.advance_next();
      refresh();
      // Review 7E: stop on completion AND on a failed (unsound) step.
      if (!sound || twin.completed_count() >= BLOCKS) {
        stopRun();
        autoBtn.textContent = "Run to completion";
        refresh();
      }
    }, 350);
  };

  resetBtn.onclick = () => {
    // Review 7E: clear any pending timer BEFORE replacing the twin, or the
    // orphaned interval keeps mutating the fresh instance.
    stopRun();
    autoBtn.textContent = "Run to completion";
    replaceTwin();
    refresh();
  };

  window.addEventListener("beforeunload", () => {
    stopRun();
    twin.free();
  });

  refresh();
}
</script>
</body>
</html>
