version: 2
updates:
  # Workspace dependencies (review 7G: keep the MIT-chain allow-list current
  # against new releases and advisories).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # The MSRV job pins dtolnay/rust-toolchain@<MSRV>; the tag is the Rust
      # version, so Dependabot "bumps" it to toolchains that don't exist.
      - dependency-name: "dtolnay/rust-toolchain"
