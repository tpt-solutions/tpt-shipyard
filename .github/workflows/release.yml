name: Release

on:
  push:
    tags: ["v*.*.*"]

jobs:
  test:
    name: Pre-release tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo deny check licenses bans

  verify-tag:
    name: Tag matches workspace version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag against workspace version
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          ws_version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          echo "tag v$tag vs workspace $ws_version"
          [ "$tag" = "$ws_version" ] || {
            echo "::error::tag v$tag does not match the workspace version $ws_version"
            exit 1
          }

  publish:
    name: Publish to crates.io
    needs: [test, verify-tag]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Review 7G: dry-run first, publish locked, never --allow-dirty.
      - name: Publish dry run
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked --dry-run
      - name: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --workspace --locked
      - name: Build WASM package for the release assets
        run: |
          cargo install wasm-bindgen-cli@0.2.128 --locked
          cargo build -p tpt-yard-wasm --target wasm32-unknown-unknown --release --locked
          wasm-bindgen --out-dir pkg --target web target/wasm32-unknown-unknown/release/tpt_yard_wasm.wasm
      - name: Upload WASM package
        uses: actions/upload-artifact@v4
        with:
          name: tpt-yard-wasm-web
          path: pkg/

  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download WASM package
        uses: actions/download-artifact@v4
        with:
          name: tpt-yard-wasm-web
          path: pkg
      - name: Create release with generated notes and WASM assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: pkg/*
