name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  build-test:
    name: Build & Test (${{ matrix.os }})
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Tests
        run: cargo test --workspace --locked
      - name: Docs
        run: cargo doc --workspace --no-deps --locked

  examples:
    name: Examples run
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run every example
        run: |
          for ex in container-ship-block-assembly orbital-station-truss \
                    rotating-habitat-construction submarine-pressure-hull \
                    space-solar-array-assembly drydock-flooding-sequence                     hull-stability-screen; do
            echo "== $ex =="
            cargo run -p "$ex" --locked
          done
      # Review 7F leftover: book and README Rust snippets cannot rot —
      # every non-`ignore` fenced block is compiled against the built
      # workspace rlibs.
      - name: Compile-test book and README snippets
        run: python scripts/test-snippets.py

  python-bindings:
    name: Python bindings
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The PyO3 crate is detached from the workspace (pyo3 needs a
      # Python interpreter at build time); build it standalone, rename
      # the cdylib to the module name and drive it end-to-end.
      - name: Build extension module
        run: cargo build --release --locked --manifest-path crates/bindings/tpt-yard-py/Cargo.toml
      - name: Import and exercise the module
        run: |
          mkdir -p /tmp/tpt_yard_py
          cp crates/bindings/tpt-yard-py/target/release/libtpt_yard_py.so /tmp/tpt_yard_py/tpt_yard_py.so
          python - <<'EOF'
          import sys
          sys.path.insert(0, "/tmp/tpt_yard_py")
          import tpt_yard_py
          twin = tpt_yard_py.DigitalTwin.from_project_json(
              open("templates/container-ship.json", encoding="utf-8").read())
          report = twin.weight_report()
          assert report["design_weight_kg"] == 8400000.0, report
          twin.advance_phase(1)
          hull = tpt_yard_py.HullForm(140.0, 22.0, 0.72, 0.85)
          hs = hull.hydrostatics(6.0)
          assert abs(hs["displacement_t"] - 0.72*140*22*6*1.025) < 1e-6, hs
          gz = hull.gz_curve(6.0, 8.0, 40.0)
          assert gz[0][0] == 0.0 and len(gz) >= 5
          print("python bindings OK")
          EOF

  wasm:
    name: WASM build + browser tests
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build tpt-yard-wasm for wasm32
        run: cargo build -p tpt-yard-wasm --target wasm32-unknown-unknown --locked
      # Review 7G: the pinned wasm-bindgen-cli matches the workspace's
      # `wasm-bindgen = "=0.2.128"`, and .cargo/config.toml wires
      # wasm-bindgen-test-runner so `cargo test` drives headless Chrome
      # through the #[wasm_bindgen_test] browser tests.
      - name: Install pinned wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli@0.2.128 --locked
      - name: Install chromedriver matching the runner's Chrome
        run: |
          CHROME_VERSION="$(google-chrome --version | awk '{print $3}')"
          MILESTONE="${CHROME_VERSION%.*}"
          DRIVER_VERSION="$(curl -s https://googlechromelabs.github.io/chrome-for-testing/latest-patch-versions-per-build.json | python3 -c "import json,sys; print(json.load(sys.stdin)['builds']['$MILESTONE']['version'])")"
          echo "Chrome $CHROME_VERSION -> chromedriver $DRIVER_VERSION"
          curl -sSLo /tmp/cd.zip \
            "https://storage.googleapis.com/chrome-for-testing-public/${DRIVER_VERSION}/linux64/chromedriver-linux64.zip"
          sudo unzip -o /tmp/cd.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/chromedriver-linux64/chromedriver
          sudo ln -sf /usr/local/bin/chromedriver-linux64/chromedriver /usr/local/bin/chromedriver
      - name: Browser tests (wasm-bindgen-test, headless Chrome)
        run: cargo test -p tpt-yard-wasm --target wasm32-unknown-unknown --locked
      - name: Build www/pkg for the dashboard
        run: |
          wasm-bindgen --out-dir www/pkg --target web \
            target/wasm32-unknown-unknown/debug/tpt_yard_wasm.wasm
      - uses: actions/upload-artifact@v7
        with:
          name: tpt-yard-wasm-web
          path: www/pkg/

  msrv:
    name: MSRV
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      # Review 7G: the MSRV job runs the tests, not just a check — a
      # feature the tests exercise can still fail to *run* on the MSRV.
      - run: cargo test --workspace --locked

  semver:
    name: SemVer compatibility
    needs: fmt
    runs-on: ubuntu-latest
    # cargo-semver-checks needs a published baseline on crates.io. Set the
    # repository variable CRATE_PUBLISHED=true after the first release of tpt-yard.
    if: vars.CRATE_PUBLISHED == 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-semver-checks
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          # Pre-1.0 workspace: minor bumps are allowed to break.
          feature-group: default-features

  coverage:
    name: Coverage
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: lcov.info
