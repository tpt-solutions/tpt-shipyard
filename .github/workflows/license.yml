name: License check

on:
  push:
    branches: [main, master]
  pull_request:
  # Review 7G: advisories and sources drift daily — run the FULL deny
  # check (licenses, bans, advisories, sources) on a weekly schedule too.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  cargo-deny:
    name: cargo-deny (MIT chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
