# Review 7G leftover: changelog/version automation. Two standard
# release-plz jobs — one merges prepared release PRs (and tags/GitHub
# releases per release-plz.toml), one opens/updates the release PR on
# every push to master. crates.io publishing stays with the tag-verified
# `release.yml`.
name: Release-plz

on:
  push:
    branches: [main, master]

permissions:
  pull-requests: write
  contents: write

jobs:
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: github.repository_owner == 'tpt-solutions'
    concurrency:
      # Distinct groups: two jobs of the SAME run sharing one group cancel
      # each other (the first Release-plz run after the config fix showed
      # exactly that).
      group: release-plz-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: github.repository_owner == 'tpt-solutions'
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
